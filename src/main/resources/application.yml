server:
  port: 8070
#  servlet:
#    context-path: /api

spring:
  application:
    version: 1.1.6
    name: api-gateway
  webflux:
    base-path: /api

  cloud:
    config:
      enabled: false
    gateway:
      routes:

        # =================== CORE SERVICE =================
        - id: core-service
          uri: http://core-service:8080
          predicates:
            - Path=/api/core-service/**

        - id: core-service-swagger
          uri: http://core-service:8080
          predicates:
            - Path=/core-service/v3/api-docs/**


        # ================= MARKETPLACE SERVICE =================
        - id: marketPlace
          uri: http://localhost:8090
          predicates:
            - Path=/marketPlace/**




        - id: marketPlace-swagger
          uri: http://localhost:8090
          predicates:
            - Path=/marketPlace/v3/api-docs/**





  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://wiki.myddns.me/auth/realms/my-realm


# ================= SWAGGER AGGREGATION =================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    persistAuthorization: false

    urls:
      - name: api-gateway
        url: /v3/api-docs

      - name: core-service
        url: /core-service/v3/api-docs

      - name: marketPlace
        url: /marketPlace/v3/api-docs

    displayOperationId: true
    tryItOutEnabled: true

keycloak:
  for-api-api-gateway:
    client_id: api-gateway
    client_secret: sKOdgjg5nYuSKBoLE6xFyvNSPXTsco7G


logging:
  level:
    root: INFO

    # لاگ‌های خود API Gateway
    org.springframework.cloud.gateway: TRACE

    # تشخیص Route و Predicate
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
    org.springframework.cloud.gateway.route: DEBUG

    # لاگ‌های WebFlux و پردازش درخواست
    org.springframework.web.reactive: DEBUG
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG

    # لاگ‌های HTTP Client و اتصال به سرویس مقصد
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG

    # امنیت و احراز هویت
    org.springframework.security: DEBUG
