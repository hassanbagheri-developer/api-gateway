name: api-gateway
###
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_namespace:
        description: "Select target namespace"
        required: true
        default: app
        type: choice
        options:
          - app
          - app-test

env:
  IMAGE_NAME: hassan233/api-gateway
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    if: contains(github.event.head_commit.message, 'build') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      image_tag: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "21"

      - name: Build JAR
        run: mvn clean package

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .
          docker build -t $IMAGE_NAME:1.0.${{ github.run_number }} .

      - name: Login to DockerHub
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u hassan233 --password-stdin

      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:1.0.${{ github.run_number }}

  deploy:
    needs: build
    environment: production
    #if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GLOBAL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo  ${{ vars.SERVER_IP }}
          ssh-keyscan -H  ${{ vars.SERVER_IP }}  >> ~/.ssh/known_hosts

      - name: Deploy with Helm
        run: |
          ssh ${{ github.USER_SERVER }}@${{ github.IP_SERVER }} << EOF
            set -e

            NAMESPACE="${{ github.event.inputs.deploy_namespace }}"
            if [ -z "\$NAMESPACE" ]; then
              NAMESPACE="app"
            fi

            echo "Deploying to namespace: \$NAMESPACE"

            cd /opt/github/helm/helm-api-gateway

            helm upgrade --install api-gateway . \
              --namespace \$NAMESPACE \
              --create-namespace \
              --set image.tag=1.0.${{ github.run_number }}
          EOF
